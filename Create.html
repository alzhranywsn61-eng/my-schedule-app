<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع متابعة الجداول - متابعة الحصص</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f4f9; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .navbar { background-color: #3b2054; width: 100%; padding: 12px 0; display: flex; justify-content: center; gap: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); position: sticky; top: 0; z-index: 1000; flex-wrap: wrap; }
        .navbar a { color: #ffffff; text-decoration: none; font-size: 14px; font-weight: bold; transition: 0.3s; }
        .navbar a:hover, .navbar a.active { color: #dcd6e7; text-decoration: underline; }
        .content-body { padding: 20px; display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 700px; }
        h2 { color: #3b2054; margin-top: 20px; }
        .table-container { width: 100%; background: #fff; padding: 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 25px; }
        h3 { font-size: 16px; color: #4a2c6d; border-bottom: 2px solid #e2d9eb; padding-bottom: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #dcd6e7; padding: 8px; text-align: center; }
        th { background-color: #4a2c6d; color: white; font-size: 14px; border-radius: 5px; }
        input.cell-input { width: 90%; padding: 6px; border: 1px solid #ccc; border-radius: 6px; text-align: center; font-size: 13px; }
        .buttons-container { display: flex; gap: 10px; margin-bottom: 40px; justify-content: center; }
        .pdf-btn { background-color: #4a2c6d; color: white; border: none; padding: 12px 35px; font-size: 15px; border-radius: 25px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.3s; }
        .pdf-btn:hover { background-color: #3b2054; }

        @media print {
            .navbar, .buttons-container { display: none !important; }
            body { background-color: white; }
            .table-container { box-shadow: none; padding: 0; }
        }
    </style>
</head>
<body>

    
    <div class="navbar">
  <a href="index.html">جدول المهارات الأسبوعية</a>
  <a href="waiting.html">حصص الانتظار</a>
  <a href="followup.html">الإشراف على الحصص</a>
  <a href="Create.html" class="active">متابعة الحصص</a>
</div>

    <div class="content-body">
        <h2>نظام متابعة الجداول</h2>
        <div class="table-container">
            <h3>متابعة الحصص</h3>
            <table>
                <thead>
                    <tr>
                        <th>اليوم</th>
                        <th>الحصة الأولى</th>
                        <th>الحصة الثانية</th>
                        <th>الحصة الثالثة</th>
                        <th>الحصة الرابعة</th>
                        <th>الحصة الخامسة</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>الأحد</td><td><input type="text" class="cell-input" data-name="create_d1_c1"></td><td><input type="text" class="cell-input" data-name="create_d1_c2"></td><td><input type="text" class="cell-input" data-name="create_d1_c3"></td><td><input type="text" class="cell-input" data-name="create_d1_c4"></td><td><input type="text" class="cell-input" data-name="create_d1_c5"></td></tr>
                    <tr><td>الإثنين</td><td><input type="text" class="cell-input" data-name="create_d2_c1"></td><td><input type="text" class="cell-input" data-name="create_d2_c2"></td><td><input type="text" class="cell-input" data-name="create_d2_c3"></td><td><input type="text" class="cell-input" data-name="create_d2_c4"></td><td><input type="text" class="cell-input" data-name="create_d2_c5"></td></tr>
                    <tr><td>الثلاثاء</td><td><input type="text" class="cell-input" data-name="create_d3_c1"></td><td><input type="text" class="cell-input" data-name="create_d3_c2"></td><td><input type="text" class="cell-input" data-name="create_d3_c3"></td><td><input type="text" class="cell-input" data-name="create_d3_c4"></td><td><input type="text" class="cell-input" data-name="create_d3_c5"></td></tr>
                    <tr><td>الأربعاء</td><td><input type="text" class="cell-input" data-name="create_d4_c1"></td><td><input type="text" class="cell-input" data-name="create_d4_c2"></td><td><input type="text" class="cell-input" data-name="create_d4_c3"></td><td><input type="text" class="cell-input" data-name="create_d4_c4"></td><td><input type="text" class="cell-input" data-name="create_d4_c5"></td></tr>
                    <tr><td>الخميس</td><td><input type="text" class="cell-input" data-name="create_d5_c1"></td><td><input type="text" class="cell-input" data-name="create_d5_c2"></td><td><input type="text" class="cell-input" data-name="create_d5_c3"></td><td><input type="text" class="cell-input" data-name="create_d5_c4"></td><td><input type="text" class="cell-input" data-name="create_d5_c5"></td></tr>
                </tbody>
            </table>
        </div>

        <div class="buttons-container">
            <button class="pdf-btn" onclick="window.print()">حفظ</button>
        </div>
    </div>

    <script>
        window.onload = function() {
            document.querySelectorAll('.cell-input').forEach(i => {
                if(localStorage.getItem(i.dataset.name)) {
                    i.value = localStorage.getItem(i.dataset.name);
                }
                i.addEventListener('input', () => {
                    localStorage.setItem(i.dataset.name, i.value);
                });
            });
        }
    </script>
</body>
</html>
