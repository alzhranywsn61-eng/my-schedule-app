<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام متابعة الجداول</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f5f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .header-title {
            color: #3b2054;
            margin-top: 30px;
            margin-bottom: 5px;
            font-size: 26px;
            font-weight: bold;
        }

        .author-name {
            color: #3b2054;
            font-size: 18px;
            font-weight: bold;
            margin-top: 5px;
            margin-bottom: 30px;
        }

        .card-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 400px;
            margin: 0 auto;
        }

        .card {
            background-color: #ffffff;
            border-radius: 15px;
            padding: 25px 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .card h3 {
            color: #333;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .btn {
            background-color: #3b2054;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>

    <h1 class="header-title">مرحباً بكِ في نظام متابعة الجداول</h1>
    <div class="author-name">👩🏻‍💻 وسن الزهراني</div>

    <div class="card-container">
        <div class="card">
            <h3>جدول المهام الأسبوعية</h3>
            <a href="followup.html" class="btn">فتح الجدول</a>
        </div>

        <div class="card">
            <h3>حصص الانتظار</h3>
            <a href="waiting.html" class="btn">عرض الحصص</a>
        </div>
    </div>

</body>
</html>
