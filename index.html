<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام متابعة الجداول</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #f4f5f9;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .welcome-container {
            width: 90%;
            max-width: 480px;
            padding: 20px;
            text-align: center;
        }

        .welcome-title {
            color: #4a2574;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .card-box {
            background: #ffffff;
            border-radius: 16px;
            padding: 30px 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #eaeaea;
        }

        .card-box h3 {
            color: #333333;
            font-size: 19px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .card-btn {
            display: inline-block;
            background-color: #4a2574;
            color: #ffffff;
            padding: 12px 32px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            transition: background-color 0.3s;
        }

        .card-btn:hover {
            background-color: #351a54;
        }
    </style>
</head>
<body>
<b>👩🏻‍💻 وسن الزهراني </b>
    <div class="welcome-container">
        <h2 class="welcome-title">مرحباً بكِ في نظام متابعة الجداول</h2>

        <div class="card-box">
            <h3>جدول المهام الأسبوعية</h3>
            <a href="followup.html" class="card-btn">فتح الجدول</a>
        </div>

        <div class="card-box">
            <h3>حصص الانتظار</h3>
            <a href="waiting.html" class="card-btn">عرض الحصص</a>
        </div>
    </div>

</body>
</html>
